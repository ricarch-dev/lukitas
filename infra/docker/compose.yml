services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: lukitas
      POSTGRES_USER: lukitas
      POSTGRES_PASSWORD: lukitas
    ports:
      - '5433:5432'
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U lukitas -d lukitas']
      interval: 2s
      timeout: 3s
      retries: 30
    volumes:
      - postgres-data:/var/lib/postgresql/data

volumes:
  postgres-data:
